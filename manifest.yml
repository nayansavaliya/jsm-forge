modules:
  # ── Customer-facing portal (global page in JSM) ─────────────────────────────
  jira:globalPage:
    - key: jsm-service-portal
      resource: customer-portal
      resolver:
        function: main-resolver
      title: Company Help Center
      layout: basic

  # ── Agent queue panel (shown inside each JSM project queue view) ─────────────
  jiraServiceManagement:portalRequestDetailPanel:
    - key: request-detail-panel
      resource: customer-portal
      resolver:
        function: main-resolver
      title: Request Details

  # ── Scheduled trigger: sync config → JSM on deploy ──────────────────────────
  scheduledTrigger:
    - key: config-sync-trigger
      function: sync-engine
      interval: day # re-sync daily to detect and heal drift

  # ── Issue event triggers ─────────────────────────────────────────────────────
  trigger:
    - key: issue-created-trigger
      function: issue-event-handler
      events:
        - jira:issue_created

    - key: issue-updated-trigger
      function: issue-event-handler
      events:
        - jira:issue_updated

    - key: issue-resolved-trigger
      function: issue-event-handler
      events:
        - jira:issue_resolved

  # ── Forge Functions ──────────────────────────────────────────────────────────
  function:
    - key: main-resolver
      handler: index.handler

    - key: sync-engine
      handler: index.syncEngine

    - key: issue-event-handler
      handler: index.issueEvents

resources:
  - key: customer-portal
    path: static/customer-portal/build

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:servicedesk-request
    - write:servicedesk-request
    - manage:jira-project
    - manage:jira-configuration
    - storage:app
  content:
    scripts:
      - 'unsafe-inline'
    styles:
      - 'unsafe-inline'
  external:
    fetch:
      backend:
        - "*" # Locked down per-source via allowedPaths whitelist in config

app: #Enterprise Service Desk
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/07039022-b9b7-4a74-8881-a87efa226afb
