name: Deploy to Production

on:
  push:
    branches: [main]

# Only run one deploy at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    name: Pre-deploy validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate-config

  deploy:
    name: Forge deploy
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Forge CLI
        run: npm install -g @forge/cli

      - name: Build
        run: npm run build

      - name: Deploy to production
        run: forge deploy --environment production --no-interactive
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}

      - name: Upgrade app installation
        run: forge install --upgrade --environment production --no-interactive
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Deployed successfully at $(date -u)"
