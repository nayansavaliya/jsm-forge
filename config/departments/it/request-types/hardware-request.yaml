id: rt-it-hardware
name: "Hardware Request"
description: "Request a new laptop, monitor, or peripheral device"
icon: laptop
jsmRequestTypeId: ~  # null = auto-create on first sync

form:
  version: 1
  fields:
    - id: f_hardware_type
      label: "Hardware Type"
      type: dynamic-select
      required: true
      apiSourceId: api-inventory
      apiPath: /hardware/types
      valueKey: id
      labelKey: name
      cacheTtlSeconds: 300

    - id: f_model
      label: "Model"
      type: cascading-select
      required: true
      dependsOn: f_hardware_type
      apiSourceId: api-inventory
      apiPath: "/hardware/models?typeId={{f_hardware_type}}"
      valueKey: modelId
      labelKey: modelName
      cacheTtlSeconds: 120

    - id: f_quantity
      label: "Quantity"
      type: number
      required: true
      validation:
        min: 1
        max: 10

    - id: f_justification
      label: "Business Justification"
      type: textarea
      required: true
      validation:
        minLength: 20
        maxLength: 500

    - id: f_needed_by
      label: "Needed By Date"
      type: date
      required: false

  conditions:
    - when:
        fieldId: f_hardware_type
        operator: equals
        value: laptop
      show:
        - f_model
        - f_quantity

  approval:
    enabled: true
    stages:
      - name: "Line Manager Approval"
        approverType: reporter-manager
      - name: "Finance Approval"
        condition: "f_quantity > 3"
        approverType: specific
        approverAccountId: "REPLACE_WITH_FINANCE_ACCOUNT_ID"
